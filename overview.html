<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#507DE5" />
<title>Power Analytix — Monthly Overview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Albert+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3/lib/msal-browser.min.js"></script>
<style>
  :root{
    --ink:#10183a;--bg:#eef2fb;--card:#fff;--brand:#507DE5;--brand-dk:#2f55b8;--brand-deep:#1b3a8c;
    --line:#dde4f3;--muted:#69718c;--err:#b3261e;
  }
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;font-family:'Albert Sans',system-ui,sans-serif;color:var(--ink);
    background:radial-gradient(130% 90% at 0% 0%,#dce7fb 0%,transparent 55%),var(--bg);padding:24px;}
  header{display:flex;align-items:center;gap:13px;margin-bottom:18px;}
  .logo{width:48px;height:48px;border-radius:12px;background:#fff;border:1px solid var(--line);object-fit:contain;padding:5px;}
  .kicker{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--brand);font-weight:600;}
  h1{font-family:'Sora',sans-serif;font-weight:700;font-size:22px;margin:2px 0 0;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 20px 44px -34px rgba(16,24,58,.4);max-width:1500px;margin:0 auto;}
  button{font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;border:none;border-radius:9px;padding:10px 16px;background:linear-gradient(135deg,var(--brand),var(--brand-deep));color:#fff;}
  button.ghost{background:#eef2fb;color:var(--brand-dk);}
  input[type=month]{font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:9px;}
  .controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px;}
  .muted{color:var(--muted);font-size:14px;}
  .hidden{display:none !important;}
  #msg{padding:10px 12px;border-radius:9px;margin:10px 0;display:none;font-size:14px;}
  #msg.show{display:block;background:#fbeae9;color:var(--err);border:1px solid #f3c9c6;}

  /* legend */
  .legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin:6px 0 16px;font-size:12px;color:#3a4360;}
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .sw{width:12px;height:12px;border-radius:3px;display:inline-block;}

  /* grid */
  .scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px;}
  table.grid{border-collapse:collapse;font-size:11px;width:100%;}
  table.grid th,table.grid td{border:1px solid #eef1f8;padding:0;text-align:center;}
  table.grid thead th{background:#f6f8fd;font-weight:600;color:#3a4360;padding:5px 4px;position:sticky;top:0;}
  th.name,td.name{position:sticky;left:0;background:#fff;text-align:left;padding:6px 8px;font-weight:600;min-width:110px;max-width:130px;z-index:2;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  thead th.name{z-index:3;background:#f6f8fd;}
  th.day{min-width:30px;width:30px;}
  th.day .dow{display:block;font-size:9px;color:var(--muted);font-weight:500;}
  th.tot,td.tot{min-width:50px;background:#f6f8fd;font-weight:700;color:var(--brand-dk);font-size:11px;}
  td.tot-abs{color:#c0392b;}
  td.weekend{background:#fbfcfe;}
  .bar{height:58px;display:flex;flex-direction:column-reverse;justify-content:flex-start;margin:2px;border-radius:3px;overflow:hidden;}
  .seg{width:100%;}
  td.daycell{vertical-align:bottom;}
  .totrow td{background:#f1f5fd;font-weight:600;}
  .totrow td.name{background:#f1f5fd;}

  /* per-activity totals block */
  .acttotals{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;}
  .acttotals .chip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;background:#fff;}
  .acttotals .chip b{font-size:15px;}
  .grand{margin-top:10px;font-size:14px;color:var(--muted);}
  .grand b{color:var(--ink);font-size:16px;}

  #login{text-align:center;padding:30px 0;}
  @media print{
    @page{size:A4 landscape;margin:8mm;}
    body{background:#fff;padding:0;}
    .controls,#login,button,.no-print{display:none !important;}
    .card{border:none;box-shadow:none;max-width:none;padding:0;}
    .scroll{overflow:visible;border:none;}
    table.grid{font-size:8px;}
    .bar{height:42px;}
    th.name,td.name{min-width:90px;max-width:110px;}
  }
</style>
</head>

  staffSiteId: "netorgft7286889.sharepoint.com,7ea87cd4-0fea-4a09-9591-d64b03c67873,74b8ba2d-7746-467d-a85a-e6882f9a11bd",
  staffListId: "cabf2431-0a5e-49d2-8682-ebf5537f134c",
  admins: ["wesley.hughes@utilitiesms.co.uk"]
};
const GRAPH = "https://graph.microsoft.com/v1.0";
const SCOPES = ["User.Read","Sites.ReadWrite.All"];

/* Activity colours — tweak freely */
const ACTIVITY_COLOURS = {
  "Meeting":      "#4E79C6",  // blue
  "Project work": "#3F9E68",  // green
  "Routine / BAU":"#7FB069",  // olive green
  "Training":     "#8E7CC3",  // purple (moved off red)
  "Development":  "#D26FA0",  // magenta/pink
  "Demo":         "#3FB0B0",  // teal
  "Admin":        "#6B8CAE",  // slate blue-grey
  "Adhoc":        "#C9A24B",  // muted gold
  "Other":        "#9AA3B8",  // grey
  "Annual Leave": "#F2933C",  // ORANGE — stands out
  "Sick":         "#E03131"   // BRIGHT RED — stands out
};
const FALLBACK_COLOUR = "#9aa3bd";
const ABSENCE_ACTIVITIES = ["Sick","Annual Leave"];
function isAbsence(a){ return ABSENCE_ACTIVITIES.includes(a); }
function colourFor(a){ return ACTIVITY_COLOURS[a] || FALLBACK_COLOUR; }

const msalConfig = { auth:{ clientId:CONFIG.clientId, authority:"https://login.microsoftonline.com/"+CONFIG.tenantId, redirectUri:CONFIG.redirectUri }, cache:{cacheLocation:"sessionStorage"} };
let pca, account=null, staffNames={};
const $ = id => document.getElementById(id);
function showMsg(t){ $("msg").textContent=t; $("msg").className="show"; }
function clearMsg(){ $("msg").className=""; }
function pad(n){ return String(n).padStart(2,"0"); }
function localYMD(iso){ const d=new Date(iso); if(isNaN(d)) return (iso||"").slice(0,10); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }

/* ---------------- auth ---------------- */
async function init(){
  pca = new msal.PublicClientApplication(msalConfig);
  await pca.initialize();
  try{ const r=await pca.handleRedirectPromise(); if(r&&r.account) account=r.account; }catch(e){ console.error(e); }
  if(!account){ const a=pca.getAllAccounts(); if(a.length) account=a[0]; }
  if(account) afterLogin(); else $("login").classList.remove("hidden");
}
$("loginBtn").onclick=()=>pca.loginRedirect({scopes:SCOPES});
async function getToken(){ try{ const r=await pca.acquireTokenSilent({scopes:SCOPES,account}); return r.accessToken; }catch(e){ await pca.acquireTokenRedirect({scopes:SCOPES}); throw e; } }

function isAdmin(){ return CONFIG.admins.map(s=>s.toLowerCase()).includes((account.username||"").toLowerCase()); }

async function afterLogin(){
  $("login").classList.add("hidden");
  $("app").classList.remove("hidden");
  $("signed").textContent = "Signed in as " + (account.name||account.username);
  if(!isAdmin()){
    $("app").innerHTML = '<p class="muted">This overview is for administrators only.</p>';
    return;
  }
  // default month = last month
  const d=new Date(); d.setDate(1); d.setMonth(d.getMonth()-1);
  $("month").value = d.getFullYear()+"-"+pad(d.getMonth()+1);
  renderLegend();
  await loadStaffNames();
}
$("loadBtn").onclick = loadOverview;
$("printBtn").onclick = ()=>window.print();

function renderLegend(){
  $("legend").innerHTML = Object.keys(ACTIVITY_COLOURS).map(a =>
    '<span><i class="sw" style="background:'+ACTIVITY_COLOURS[a]+'"></i>'+a+'</span>').join("");
}

/* ---------------- data ---------------- */
async function loadStaffNames(){
  try{
    const token=await getToken();
    const res=await fetch(GRAPH+"/sites/"+CONFIG.staffSiteId+"/lists/"+CONFIG.staffListId+"/items?$expand=fields&$top=500",{headers:{Authorization:"Bearer "+token}});
    if(res.ok){ const d=await res.json(); (d.value||[]).forEach(i=>{ const f=i.fields||{}; if(f.Title) staffNames[(f.Title||"").toLowerCase()]=f.OfficialName||f.Title; }); }
  }catch(e){ console.warn("staff names load failed",e); }
}
function nameFor(email,fallback){ return staffNames[(email||"").toLowerCase()] || fallback || email; }

async function fetchAllRows(token){
  const res=await fetch(GRAPH+"/sites/"+CONFIG.siteId+"/lists/"+CONFIG.listId+"/items?$expand=fields&$top=500",
    {headers:{Authorization:"Bearer "+token, Prefer:"HonorNonIndexedQueriesWarningMayFailRandomly"}});
  if(!res.ok) throw new Error("Read failed: "+res.status+" (does DailyTimesheet have Read = 'all items'?)");
  const d=await res.json();
  return d.value||[];
}

async function loadOverview(){
  clearMsg();
  const ym=$("month").value; if(!ym){ showMsg("Pick a month first."); return; }
  $("out").innerHTML='<p class="muted">Loading…</p>';
  try{
    const token=await getToken();
    const rows=await fetchAllRows(token);
    const monthRows=rows.filter(it=>localYMD(it.fields&&it.fields.EntryDate).slice(0,7)===ym);
    if(!monthRows.length){ $("out").innerHTML='<p class="muted">No timesheet entries for '+monthLabel(ym)+'.</p>'; return; }
    renderGrid(monthRows, ym);
  }catch(e){ console.error(e); showMsg(e.message); $("out").innerHTML=""; }
}

function monthLabel(ym){ const [y,m]=ym.split("-"); return new Date(y,m-1,1).toLocaleDateString("en-GB",{month:"long",year:"numeric"}); }

/* ---------------- render ---------------- */
function renderGrid(rows, ym){
  const [y,m]=ym.split("-").map(Number);
  const daysInMonth=new Date(y,m,0).getDate();
  // working days (Mon-Fri)
  const days=[];
  for(let d=1; d<=daysInMonth; d++){ const dt=new Date(y,m-1,d); const dow=dt.getDay(); if(dow!==0 && dow!==6) days.push({d, dow}); }

  // index: person -> day -> activity -> hours
  const people={}; // email -> {name, days:{ 'YYYY-MM-DD': {activity:hours} }, total}
  const activityTotals={}; // activity -> hours (across all staff, the bottom Option-B totals)
  let grand=0, maxDaily=0;

  rows.forEach(it=>{
    const f=it.fields||{};
    const email=(f.StaffEmail||"").toLowerCase();
    if(!email) return;
    const day=localYMD(f.EntryDate);
    const act=f.ActivityType||"Other";
    const hrs=Number(f.HoursWorked)||0;
    if(!people[email]) people[email]={name:nameFor(email,f.StaffName), days:{}, total:0};
    if(!people[email].days[day]) people[email].days[day]={};
    people[email].days[day][act]=(people[email].days[day][act]||0)+hrs;
    people[email].total+=hrs;
    activityTotals[act]=(activityTotals[act]||0)+hrs;
    grand+=hrs;
  });

  // max single-day total (for bar scaling)
  Object.values(people).forEach(p=>Object.values(p.days).forEach(dayMap=>{
    const t=Object.values(dayMap).reduce((a,b)=>a+b,0); if(t>maxDaily) maxDaily=t;
  }));
  if(maxDaily<=0) maxDaily=8;

  const BARPX=58;
  const sortedPeople=Object.entries(people).sort((a,b)=>a[1].name.localeCompare(b[1].name));

  // header
  let html='<div class="scroll"><table class="grid"><thead><tr>';
  html+='<th class="name">Staff</th>';
  const dowL=["S","M","T","W","T","F","S"];
  days.forEach(dd=> html+='<th class="day">'+dd.d+'<span class="dow">'+dowL[dd.dow]+'</span></th>');
  html+='<th class="tot">Hours</th><th class="tot">Days worked</th><th class="tot">Days absent</th></tr></thead><tbody>';

  // rows
  sortedPeople.forEach(([email,p])=>{
    html+='<tr><td class="name">'+esc(p.name)+'</td>';
    days.forEach(dd=>{
      const key=y+"-"+pad(m)+"-"+pad(dd.d);
      const dayMap=p.days[key];
      if(!dayMap){ html+='<td class="daycell"></td>'; return; }
      const acts=Object.entries(dayMap).sort((a,b)=>b[1]-a[1]);
      const dayTotal=acts.reduce((a,b)=>a+b[1],0);
      let segs='';
      acts.forEach(([a,h])=>{
        const px=Math.max(2, Math.round(h/maxDaily*BARPX));
        segs+='<div class="seg" style="height:'+px+'px;background:'+colourFor(a)+'" title="'+esc(a)+': '+h+'h"></div>';
      });
      html+='<td class="daycell" title="'+esc(p.name)+' · '+key+' · '+dayTotal+'h"><div class="bar">'+segs+'</div></td>';
    });
    // whole-day classification: a date is "worked" if it has any working activity; "absent" only if purely Sick/Annual Leave
    let dWorked=0, dAbsent=0;
    Object.values(p.days).forEach(dayMap=>{
      const acts=Object.keys(dayMap);
      const hasWork=acts.some(a=>!isAbsence(a));
      if(hasWork) dWorked++; else if(acts.length) dAbsent++;
    });
    html+='<td class="tot">'+p.total+'h</td><td class="tot">'+dWorked+'</td><td class="tot tot-abs">'+dAbsent+'</td></tr>';
  });

  html+='</tbody></table></div>';

  // Option B — per-activity totals across all staff
  const sortedActs=Object.entries(activityTotals).sort((a,b)=>b[1]-a[1]);
  html+='<div class="acttotals">'+sortedActs.map(([a,h])=>
    '<div class="chip"><i class="sw" style="background:'+colourFor(a)+'"></i>'+esc(a)+' <b>'+h+'h</b></div>').join("")+'</div>';
  html+='<div class="grand">Total hours logged in '+monthLabel(ym)+': <b>'+grand+'h</b> across '+sortedPeople.length+' staff.</div>';

  $("out").innerHTML=html;
}

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

init();
</script>
</body>
</html>
